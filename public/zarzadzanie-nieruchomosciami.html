<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfel Nieruchomości — zarządzanie wynajmem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0A1422;
    --surface:#14253D;
    --surface-2:#1B2F4B;
    --ink:#F4F6F9;
    --ink-soft:#A9B8CB;
    --ink-faint:#6C7F96;
    --brass:#E0A847;
    --brass-deep:#BD8730;
    --brass-soft:rgba(224,168,71,.16);
    --on-gold:#16263B;
    --income:#4FB686;
    --income-soft:rgba(79,182,134,.16);
    --expense:#E8786A;
    --expense-soft:rgba(232,120,106,.16);
    --line:#223349;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 32px -14px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 650px at 88% -8%, rgba(45,90,145,.32), transparent 60%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Inter',sans-serif; font-weight:700; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  .shell{ display:flex; flex-direction:column; min-height:100vh; }

  /* TOPBAR */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; background:var(--surface); color:var(--ink); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand .mark{
    width:30px;height:30px;border-radius:7px;background:var(--brass);
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;font-weight:700;color:var(--on-gold);font-size:16px;
  }
  .brand h1{ font-size:19px; margin:0; color:#fff; }
  .brand .tagline{ font-size:12px; color:var(--ink-soft); }
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border-radius:9px; border:1px solid transparent; padding:9px 16px;
    font-size:13.5px; font-weight:600; transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-brass{ background:var(--brass); color:var(--on-gold); }
  .btn-brass:hover{ background:var(--brass-deep); }
  .btn-ghost{ background:transparent; border-color:rgba(255,255,255,.25); color:#fff; }
  .btn-ghost:hover{ background:rgba(255,255,255,.08); }
  .btn-line{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-line:hover{ background:var(--surface-2); }
  .btn-danger-text{ background:transparent; color:var(--expense); border-color:transparent; padding:6px 10px; font-size:12.5px; }
  .btn-danger-text:hover{ background:var(--expense-soft); border-radius:7px; }
  .btn-icon{ background:transparent; border:1px solid var(--line); border-radius:8px; padding:6px 9px; color:var(--ink-soft); font-size:13px; }
  .btn-icon:hover{ background:var(--surface-2); color:var(--ink); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }

  .demo-banner{
    background:var(--brass-soft); color:var(--brass);
    font-size:12.5px; padding:8px 28px; border-bottom:1px solid rgba(224,168,71,.3);
  }

  .body{ display:flex; flex:1; min-height:0; }

  /* SIDEBAR */
  .sidebar{
    width:300px; flex:none; padding:22px 18px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:14px;
  }
  .sidebar-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); font-weight:600; padding:0 4px;}
  .prop-list{ display:flex; flex-direction:column; gap:10px; }
  .prop-card{
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--ink-faint);
    border-radius:11px; padding:13px 14px; cursor:pointer; transition:box-shadow .15s, transform .15s, background .15s;
  }
  .prop-card:hover{ box-shadow:var(--shadow); transform:translateY(-1px); background:var(--surface-2); }
  .prop-card.active{ border-left-color:var(--brass); box-shadow:var(--shadow); background:var(--surface-2); }
  .prop-card.status-active{ border-left-color:var(--brass); }
  .prop-card.status-inactive{ border-left-color:var(--ink-faint); opacity:.75; }
  .prop-card.status-for_sale{ border-left-color:var(--expense); }
  .prop-card .name{ font-family:'Inter',sans-serif; font-weight:600; font-size:15px; margin-bottom:2px; }
  .prop-card .addr{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .prop-card .mini-stats{ display:flex; gap:10px; font-size:11.5px; }
  .prop-card .mini-stats span{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .prop-card .mini-stats .pos{ color:var(--income); }
  .prop-card .mini-stats .neg{ color:var(--expense); }
  .empty-side{ font-size:12.5px; color:var(--ink-soft); padding:10px 4px; line-height:1.5; }

  /* MAIN */
  .main{ flex:1; padding:30px 36px 60px; overflow-y:auto; min-width:0; }
  .fade-in{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .fade-in{ animation:none; } }

  .prop-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:6px; }
  .prop-header h2{ font-size:27px; margin:0 0 4px; }
  .prop-header .addr{ color:var(--ink-soft); font-size:13.5px; }
  .prop-actions{ display:flex; gap:8px; align-items:center; flex:none; }

  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    padding:5px 15px; border:2px dashed currentColor; border-radius:999px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.09em;
    text-transform:uppercase; transform:rotate(-3deg); font-weight:600; white-space:nowrap;
  }
  .stamp.occupied{ color:var(--income); }
  .stamp.vacant{ color:var(--expense); }
  .stamp.status-active{ color:var(--brass); }
  .stamp.status-inactive{ color:var(--ink-faint); }
  .stamp.status-for_sale{ color:var(--expense); }

  /* TABS */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:18px 0 22px; overflow-x:auto; }
  .tab-btn{
    background:transparent; border:none; border-bottom:2px solid transparent;
    padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
    display:inline-flex; align-items:center;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--brass); }
  .tab-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    padding:0 4px; border-radius:999px; background:var(--expense); color:#fff; font-size:10px;
    font-weight:700; margin-left:6px;
  }

  /* STAT CARDS */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:26px; }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .stat-card .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; }
  .stat-card .value{ font-size:25px; font-weight:600; margin-top:7px; }
  .stat-card .value.pos{ color:var(--income); }
  .stat-card .value.neg{ color:var(--expense); }
  .stat-card .sub{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:22px; }
  .panel h3{ font-size:14.5px; margin:0 0 14px; color:var(--ink); }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .panel-head h3{ margin:0; }

  /* INFO PANEL */
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:16px; }
  .info-item .label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .info-item .value{ font-size:14px; margin-top:4px; color:var(--ink); font-weight:500; }

  /* CHART */
  .chart-legend{ display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .chart-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .chart-legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .leg-income{ background:var(--income); }
  .leg-expense{ background:var(--expense); }

  /* LEDGER ROWS */
  .ledger-row{ display:flex; align-items:baseline; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-row .desc-block{ display:flex; align-items:baseline; gap:8px; flex:1; min-width:0; flex-wrap:wrap; }
  .ledger-row .desc-text{ font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46%; }
  .ledger-row .tag{
    font-size:10.5px; padding:2px 8px; border-radius:999px; white-space:nowrap;
    background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line);
  }
  .ledger-row .leader{ flex:1; border-bottom:1px dotted var(--ink-faint); height:0; transform:translateY(-4px); min-width:16px; }
  .ledger-row .meta{ font-size:11px; color:var(--ink-faint); white-space:nowrap; }
  .ledger-row .amount{ font-weight:600; white-space:nowrap; font-size:14px; }
  .amount.income{ color:var(--income); }
  .amount.expense{ color:var(--expense); }
  .ledger-row .row-actions{ display:flex; gap:4px; flex:none; }
  .ledger-auto-tag{ font-size:10.5px; color:var(--ink-faint); font-style:italic; white-space:nowrap; }

  /* PAYMENT STATUS */
  .pay-status{ border:1px solid var(--line); border-radius:8px; background:var(--surface-2); font-size:11px; padding:5px 8px; font-weight:600; }
  .pay-status.pay-paid{ color:var(--income); }
  .pay-status.pay-unpaid{ color:var(--expense); }
  .pay-status.pay-late{ color:var(--brass); }

  /* FILTER GROUPS (Finanse) */
  .filter-group{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .filter-group .filter-group-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; flex-wrap:wrap; gap:6px; }
  .filter-group .filter-group-head > span:first-child{ font-size:11.5px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; }
  .filter-group .checklist{ display:flex; flex-wrap:wrap; gap:9px 18px; }
  .filter-group .checklist label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); white-space:nowrap; }
  .filter-group select{ padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); font-size:12.5px; color:var(--ink); }
  .filter-mini-btn{ font-size:11px; color:var(--brass); background:transparent; border:none; cursor:pointer; padding:2px 4px; }
  .filter-mini-btn:hover{ text-decoration:underline; }

  /* ROOMS / CARDS */
  .room-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .room-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:8px; }
  .room-card .room-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .room-card .room-name{ font-family:'Inter',sans-serif; font-weight:600; font-size:15.5px; }
  .room-card .room-line{ font-size:12.5px; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .room-card .room-rent{ font-weight:600; color:var(--ink); }
  .room-card .room-tenant{ font-size:12.5px; background:var(--surface-2); border-radius:8px; padding:8px 10px; color:var(--ink-soft); line-height:1.5; }
  .room-card .room-actions{ display:flex; gap:6px; margin-top:auto; padding-top:4px; flex-wrap:wrap; }

  /* DEPOSIT BADGE */
  .deposit-badge{ display:inline-flex; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:600; margin-left:6px; }
  .deposit-badge.paid{ background:var(--income-soft); color:var(--income); }
  .deposit-badge.unpaid{ background:var(--expense-soft); color:var(--expense); }

  /* DOCUMENTS */
  .doc-section{ display:flex; flex-direction:column; gap:8px; }
  .doc-list{ display:flex; flex-direction:column; gap:6px; }
  .doc-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; padding:7px 10px; font-size:12px;
  }
  .doc-chip .doc-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .doc-chip a{ color:var(--brass); text-decoration:none; font-weight:600; white-space:nowrap; }
  .doc-chip a:hover{ text-decoration:underline; }
  .doc-remove{ color:var(--ink-faint); background:transparent; border:none; cursor:pointer; font-size:15px; line-height:1; padding:0 2px; }
  .doc-remove:hover{ color:var(--expense); }
  .doc-upload-btn input[type=file]{ display:none; }

  /* EMPTY STATES */
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state h3{ color:var(--ink); margin-bottom:6px; font-size:18px; }
  .empty-state p{ font-size:13.5px; max-width:380px; margin:0 auto 18px; line-height:1.55; }

  /* NOTES */
  textarea.notes-area{
    width:100%; min-height:160px; resize:vertical; border:1px solid var(--line); border-radius:10px;
    padding:14px; font-size:13.5px; line-height:1.6; color:var(--ink); background:var(--surface-2);
  }

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,9,16,.72); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; width:100%; max-width:560px;
    max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px -16px rgba(0,0,0,.6);
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line); }
  .modal-head h3{ margin:0; font-size:17px; }
  .modal-close{ background:transparent; border:none; font-size:20px; color:var(--ink-soft); line-height:1; padding:2px 6px; border-radius:6px; }
  .modal-close:hover{ background:var(--surface-2); }
  .modal-body{ padding:20px 22px; }
  .modal-body .hint{ font-size:11.5px; color:var(--ink-faint); margin:-6px 0 14px; line-height:1.5; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:13px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13.5px; background:var(--surface-2);
    color:var(--ink);
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .radio-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .radio-opt{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink); }
  .check-row{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:13px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--line); }

  /* TOAST */
  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--brass); color:var(--on-gold);
    padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
    opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s; z-index:60; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  @media (max-width:900px){
    .body{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--line); flex-direction:row; overflow-x:auto; align-items:center; }
    .sidebar-label{ display:none; }
    .prop-list{ flex-direction:row; }
    .prop-card{ min-width:220px; }
    .main{ padding:22px 18px 50px; }
    .form-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <span class="mark">PN</span>
      <div>
        <div class="tagline">Tu zarządzasz swoimi najmami — nie tylko tymi zawartymi przez serwis StaySafe.</div>
      </div>
    </div>
    <button class="btn btn-brass" data-action="add-property">+ Nowa nieruchomość</button>
  </div>


  <div class="body">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ======================================================================
     HELPERS
     ====================================================================== */
  let idCounter = 1000;
  const uid = (p) => p + "_" + (idCounter++);
  const PLN = new Intl.NumberFormat('pl-PL', { style:'currency', currency:'PLN', maximumFractionDigits:0 });
  const money = (n) => PLN.format(n || 0);
  const esc = (s) => (s===null||s===undefined) ? "" : String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const fmtDate = (d) => {
    if(!d) return '—';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return '—';
    return dt.toLocaleDateString('pl-PL', { day:'2-digit', month:'2-digit', year:'numeric' });
  };
  const monthKey = (d) => d ? d.slice(0,7) : '';
  const monthLabel = (key) => {
    const dt = new Date(key + '-01T00:00:00');
    return dt.toLocaleDateString('pl-PL', { month:'short' }).replace('.','') + " " + dt.getFullYear().toString().slice(2);
  };
  const monthLabelFull = (key) => {
    const dt = new Date(key + '-01T00:00:00');
    const label = dt.toLocaleDateString('pl-PL', { month:'long', year:'numeric' });
    return label.charAt(0).toUpperCase() + label.slice(1);
  };
  const daysBetween = (a,b) => Math.round((b - a) / (1000*60*60*24));
  const daysInMonth = (year, month) => new Date(year, month+1, 0).getDate();
  const formatSize = (bytes) => {
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  };

  const TODAY = new Date('2026-06-22T00:00:00');
  const TODAY_STR = '2026-06-22';

  const STATUS_LABELS = { active:'Aktywna', inactive:'Nieaktywna', for_sale:'Na sprzedaż' };
  const CATEGORY_LABELS = {
    rent_income:'Czynsz od najemcy', deposit:'Kaucja',
    mortgage:'Rata kredytu hipotecznego', admin_rent:'Czynsz do spółdzielni/wspólnoty',
    internet:'Internet', cleaning:'Sprzątanie', electricity:'Prąd', gas:'Gaz', utilities:'Media (łącznie)',
    repair:'Remont / naprawa', insurance:'Ubezpieczenie',
    tax:'Podatek', management_fee:'Opłata zarządcy', other:'Inne'
  };
  const INCOME_CATS = ['deposit','other'];
  const EXPENSE_CATS = ['mortgage','admin_rent','internet','cleaning','electricity','gas','utilities','repair','insurance','tax','management_fee','other'];
  const RECURRING_COST_CATS = ['admin_rent','mortgage','internet','cleaning','electricity','gas','utilities','other'];
  const ENERGY_CERT_LABELS = { yes:'Wyrobione', no:'Niewyrobione', in_progress:'W trakcie' };
  const PAY_STATUS_LABELS = { unpaid:'Nieopłacone', paid:'Zapłacone', late:'Opłacone po terminie' };
  const PAYMENT_FREQUENCY_MONTHS = { monthly:1, quarterly:3, semiannual:6, annual:12 };
  const PAYMENT_FREQUENCY_LABELS = { monthly:'Miesięcznie', quarterly:'Kwartalnie', semiannual:'Co pół roku', annual:'Rocznie' };
  const INSPECTION_TYPES = {
    gas:        { label:'Przegląd instalacji gazowej',     defaultMonths:12 },
    chimney:    { label:'Przegląd kominiarski',             defaultMonths:12 },
    electrical: { label:'Przegląd instalacji elektrycznej', defaultMonths:60 },
    other:      { label:'Inny przegląd',                    defaultMonths:12 }
  };
  const ALERT_WINDOW_DAYS = 60;

  function categoryLabelFor(obj){
    if(obj.category === 'other' && obj.customLabel) return esc(obj.customLabel);
    return CATEGORY_LABELS[obj.category] || obj.category;
  }

  function frequencyMonthsLabel(n){
    n = n || 1;
    if(n === 1) return 'Co miesiąc';
    if(n >= 2 && n <= 4) return 'Co ' + n + ' miesiące';
    return 'Co ' + n + ' miesięcy';
  }
  function frequencyMonthsOptions(selected){
    let html = '';
    for(let n=1; n<=12; n++){
      let label = frequencyMonthsLabel(n);
      if(n === 12) label += ' (rocznie)';
      html += `<option value="${n}" ${n===(selected||1)?'selected':''}>${label}</option>`;
    }
    return html;
  }

  /* ======================================================================
     STATE
     ====================================================================== */
  function freshFinanceFilter(propertyId){
    return { type:'all', propertyIds: propertyId ? [propertyId] : null, locationKeys: null };
  }
  const state = {
    properties: [],
    activePropertyId: null,
    activeTab: 'overview',
    financeFilter: freshFinanceFilter(null),
    taxSettings: { rate:'', frequency:'monthly', includedIds:[], payments:{} }
  };

  /* ======================================================================
     DERIVED DATA — properties / rooms
     ====================================================================== */
  function getProperty(id){ return state.properties.find(p => p.id === id); }
  function getActiveProperty(){ return getProperty(state.activePropertyId); }

  function isLeaseActive(lease, ref){
    ref = ref || TODAY;
    if(!lease.startDate) return false;
    const start = new Date(lease.startDate + 'T00:00:00');
    if(start > ref) return false;
    if(lease.endDate){
      const end = new Date(lease.endDate + 'T00:00:00');
      if(end < ref) return false;
    }
    return true;
  }
  function leaseStatus(lease, ref){
    ref = ref || TODAY;
    const start = new Date(lease.startDate + 'T00:00:00');
    if(start > ref) return 'upcoming';
    if(lease.endDate){
      const end = new Date(lease.endDate + 'T00:00:00');
      if(end < ref) return 'ended';
    }
    return 'active';
  }
  function activeLeaseFor(property, roomId){
    return property.leases.find(l => l.roomId === roomId && isLeaseActive(l));
  }

  /* Generuje wpisy czynszu na podstawie: daty pierwszej płatności (ustawionej ręcznie,
     bo zwykle nie pokrywa się z regularnym cyklem przy starcie w środku miesiąca),
     a od kolejnej płatności — dnia miesiąca + częstotliwości zadeklarowanej w umowie. */
  function leaseRentEntries(lease){
    if(!lease.startDate || !lease.monthlyRent || !lease.firstPaymentDate) return [];
    const intervalMonths = PAYMENT_FREQUENCY_MONTHS[lease.paymentFrequency] || 1;
    const amount = lease.monthlyRent * intervalMonths;
    const dueDay = lease.rentDueDay || 10;

    let capDate = TODAY;
    if(lease.endDate){
      const end = new Date(lease.endDate + 'T00:00:00');
      if(end < capDate) capDate = end;
    }

    const firstDue = new Date(lease.firstPaymentDate + 'T00:00:00');
    if(firstDue > capDate) return [];

    const dueDates = [firstDue];
    let cursorMonth = firstDue.getMonth() + intervalMonths;
    const cursorYear = firstDue.getFullYear();
    while(true){
      const day = Math.min(dueDay, daysInMonth(cursorYear, cursorMonth));
      const d = new Date(cursorYear, cursorMonth, day);
      if(d > capDate) break;
      dueDates.push(d);
      cursorMonth += intervalMonths;
    }

    const out = [];
    for(let i=0;i<dueDates.length;i++){
      const due = dueDates[i];
      const dueStr = due.toISOString().slice(0,10);
      const periodStartDate = i===0 ? new Date(lease.startDate+'T00:00:00') : due;
      let periodEndDate;
      if(i+1 < dueDates.length){
        periodEndDate = new Date(dueDates[i+1]);
        periodEndDate.setDate(periodEndDate.getDate()-1);
      } else {
        periodEndDate = lease.endDate ? new Date(lease.endDate+'T00:00:00') : due;
      }
      out.push({
        id: 'lease_' + lease.id + '_' + dueStr,
        roomId: lease.roomId, entryType:'income', category:'rent_income', amount,
        entryDate: dueStr, dueDate: dueStr,
        periodStart: periodStartDate.toISOString().slice(0,10),
        periodEnd: periodEndDate.toISOString().slice(0,10),
        isRecurring:true, recurringFrequency: lease.paymentFrequency || 'monthly',
        description: 'Czynsz — ' + (lease.tenantName || 'najemca'), isVirtual:true, leaseId: lease.id
      });
    }
    return out;
  }

  function recurringCostEntries(rc){
    if(!rc.rateHistory.length) return [];
    const sorted = rc.rateHistory.slice().sort((a,b)=> a.startDate.localeCompare(b.startDate));
    const firstStart = new Date(sorted[0].startDate + 'T00:00:00');
    if(firstStart > TODAY) return [];
    const label = categoryLabelFor(rc);
    const freq = rc.frequencyMonths || 1;
    const out = [];
    let cursor = new Date(firstStart.getFullYear(), firstStart.getMonth(), 1);
    const capMonth = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    while(cursor <= capMonth){
      const cursorKey = cursor.toISOString().slice(0,7);
      let applicable = sorted[0];
      for(const tr of sorted){ if(tr.startDate.slice(0,7) <= cursorKey) applicable = tr; else break; }
      const day = Math.min(applicable.paymentDay || 10, daysInMonth(cursor.getFullYear(), cursor.getMonth()));
      const dueDate = new Date(cursor.getFullYear(), cursor.getMonth(), day).toISOString().slice(0,10);
      out.push({
        id: 'rc_' + rc.id + '_' + cursorKey,
        roomId: null, entryType:'expense', category: rc.category, customLabel: rc.customLabel, amount: applicable.amount,
        entryDate: cursorKey + '-01', dueDate, isRecurring:true, recurringFrequency: freq,
        description: label, isVirtual:true, recurringCostId: rc.id
      });
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()+freq, 1);
    }
    return out;
  }
  function paymentStatusFor(lease, monthKeyStr){
    return (lease.payments && lease.payments[monthKeyStr]) || 'unpaid';
  }
  function allEffectiveEntries(property){
    const virtualLease = property.leases.flatMap(leaseRentEntries);
    const virtualCosts = property.recurringCosts.flatMap(recurringCostEntries);
    return property.financeEntries.concat(virtualLease, virtualCosts);
  }
  function outstandingAmount(property){
    let sum = 0;
    property.leases.forEach(lease => {
      leaseRentEntries(lease).forEach(e => {
        if(paymentStatusFor(lease, monthKey(e.entryDate)) === 'unpaid') sum += e.amount;
      });
    });
    return sum;
  }

  function propertyTotals(property){
    let income = 0, expense = 0;
    allEffectiveEntries(property).forEach(e => { if(e.entryType === 'income') income += e.amount; else expense += e.amount; });
    return { income, expense, net: income - expense };
  }
  function occupancy(property){
    if(!property.rooms.length) return null;
    const occ = property.rooms.filter(r => !!activeLeaseFor(property, r.id)).length;
    return Math.round((occ / property.rooms.length) * 100);
  }
  function monthlyTotals(property, count){
    const buckets = [];
    for(let i = count - 1; i >= 0; i--){
      const dt = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1);
      const key = dt.toISOString().slice(0,7);
      buckets.push({ key, label: monthLabel(key), income:0, expense:0 });
    }
    const byKey = {};
    buckets.forEach(b => byKey[b.key] = b);
    allEffectiveEntries(property).forEach(e => {
      const k = monthKey(e.entryDate);
      if(byKey[k]){ byKey[k][e.entryType] += e.amount; }
    });
    return buckets;
  }

  /* ======================================================================
     DERIVED DATA — taxes (ryczałt, łącznie dla portfela)
     ====================================================================== */
  function combinedTaxPeriods(){
    const settings = state.taxSettings;
    const includedProps = state.properties.filter(p => settings.includedIds.includes(p.id));
    if(!includedProps.length || !settings.rate) return [];
    const allLeases = includedProps.flatMap(p => p.leases);
    const starts = allLeases.map(l => l.startDate).filter(Boolean).sort();
    if(!starts.length) return [];
    const firstStart = new Date(starts[0] + 'T00:00:00');
    const rentEntries = allLeases.flatMap(leaseRentEntries);
    const rate = parseFloat(settings.rate) / 100;
    const periods = [];

    if(settings.frequency === 'quarterly'){
      let qStart = new Date(firstStart.getFullYear(), Math.floor(firstStart.getMonth()/3)*3, 1);
      const lastQStart = new Date(TODAY.getFullYear(), Math.floor(TODAY.getMonth()/3)*3, 1);
      while(qStart <= lastQStart){
        const qEnd = new Date(qStart.getFullYear(), qStart.getMonth()+3, 0);
        const qNum = Math.floor(qStart.getMonth()/3) + 1;
        const key = qStart.getFullYear() + '-Q' + qNum;
        const revenue = rentEntries.filter(e => {
          const d = new Date(e.entryDate + 'T00:00:00');
          return d >= qStart && d <= qEnd;
        }).reduce((s,e)=>s+e.amount,0);
        const dueDate = new Date(qEnd.getFullYear(), qEnd.getMonth()+1, 20);
        periods.push({
          key, label: ['I','II','III','IV'][qNum-1] + ' kwartał ' + qStart.getFullYear(),
          revenue, tax: revenue*rate, dueDate: dueDate.toISOString().slice(0,10)
        });
        qStart = new Date(qStart.getFullYear(), qStart.getMonth()+3, 1);
      }
    } else {
      let mStart = new Date(firstStart.getFullYear(), firstStart.getMonth(), 1);
      const lastMStart = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
      while(mStart <= lastMStart){
        const key = mStart.toISOString().slice(0,7);
        const revenue = rentEntries.filter(e => monthKey(e.entryDate) === key).reduce((s,e)=>s+e.amount,0);
        const dueDate = new Date(mStart.getFullYear(), mStart.getMonth()+1, 20);
        periods.push({ key, label: monthLabelFull(key), revenue, tax: revenue*rate, dueDate: dueDate.toISOString().slice(0,10) });
        mStart = new Date(mStart.getFullYear(), mStart.getMonth()+1, 1);
      }
    }
    return periods.reverse();
  }
  function combinedTaxDue(){
    if(!state.taxSettings.rate) return null;
    return combinedTaxPeriods().filter(p => !state.taxSettings.payments[p.key]).reduce((s,p)=>s+p.tax,0);
  }

  /* ======================================================================
     DERIVED DATA — inspections & alerts
     ====================================================================== */
  function nextInspectionDate(insp){
    if(!insp.lastDate) return null;
    const last = new Date(insp.lastDate + 'T00:00:00');
    return new Date(last.getFullYear(), last.getMonth() + insp.frequencyMonths, last.getDate());
  }
  function inspectionLabel(insp){
    return insp.type === 'other' ? (insp.customLabel || 'Przegląd') : INSPECTION_TYPES[insp.type].label;
  }
  function computeAlerts(property){
    const alerts = [];
    const windowEnd = new Date(TODAY); windowEnd.setDate(windowEnd.getDate() + ALERT_WINDOW_DAYS);

    property.inspections.forEach(insp => {
      const next = nextInspectionDate(insp);
      if(!next) return;
      if(next < TODAY) alerts.push({ severity:'overdue', text: inspectionLabel(insp) + ' — termin minął ' + fmtDate(next.toISOString().slice(0,10)), dueDate: next });
      else if(next <= windowEnd) alerts.push({ severity:'upcoming', text: inspectionLabel(insp) + ' — termin: ' + fmtDate(next.toISOString().slice(0,10)), dueDate: next });
    });

    property.leases.forEach(lease => {
      if(!lease.endDate) return;
      const end = new Date(lease.endDate + 'T00:00:00');
      const label = 'Umowa najmu — ' + (lease.tenantName || 'najemca') + (lease.isOccasional ? ' (najem okazjonalny)' : '');
      if(end >= TODAY && end <= windowEnd){
        alerts.push({ severity:'upcoming', text: label + ' kończy się ' + fmtDate(lease.endDate) + (lease.isOccasional ? ' — sprawdź ważność dokumentów najmu okazjonalnego' : ''), dueDate: end });
      } else if(end < TODAY && daysBetween(end, TODAY) <= 14){
        alerts.push({ severity:'overdue', text: label + ' — umowa wygasła ' + fmtDate(lease.endDate), dueDate: end });
      }
    });

    if(property.insuranceExpiryDate){
      const ins = new Date(property.insuranceExpiryDate + 'T00:00:00');
      if(ins < TODAY) alerts.push({ severity:'overdue', text:'Ubezpieczenie mieszkania wygasło ' + fmtDate(property.insuranceExpiryDate), dueDate: ins });
      else if(ins <= windowEnd) alerts.push({ severity:'upcoming', text:'Ubezpieczenie mieszkania kończy się ' + fmtDate(property.insuranceExpiryDate), dueDate: ins });
    }

    return alerts.sort((a,b) => a.dueDate - b.dueDate);
  }

  /* ======================================================================
     TOAST
     ====================================================================== */
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

     MODAL
     ====================================================================== */
  function openModal(html, onMount){
    document.getElementById('modalCard').innerHTML = html;

  /* ======================================================================
     RENDER — sidebar

  function renderSidebar(){
    const el = document.getElementById('sidebar');
    if(!state.properties.length){

        <div class="sidebar-label">Nieruchomości</div>
        <div class="empty-side">Nie masz jeszcze żadnej nieruchomości. Dodaj pierwszą, aby zacząć śledzić przychody i koszty.</div>

  /* ======================================================================
     RENDER — main / tabs dispatcher
     ====================================================================== */
  function renderMain(){
    const el = document.getElementById('main');
    const property = getActiveProperty();
    if(!property){
      el.innerHTML = `
        <div class="empty-state">
          <h3>Brak wybranej nieruchomości</h3>
          <p>Dodaj swoją pierwszą nieruchomość, żeby zacząć rozpisywać czynsze, koszty, umowy najmu i terminy przeglądów.</p>
          <button class="btn btn-brass" data-action="add-property">+ Nowa nieruchomość</button>
        </div>`;
      return;
    }
    const tabs = ['overview'];
    if(property.rentalMode === 'by_room') tabs.push('rooms');
    tabs.push('leases','finance','taxes','meters','schedule','notes');
    if(!tabs.includes(state.activeTab)) state.activeTab = 'overview';

    const tabLabels = { overview:'Przegląd', rooms:'Pokoje', leases:'Najem', finance:'Finanse', taxes:'Podatki', meters:'Liczniki', schedule:'Terminy', notes:'Notatki' };
    const alertCount = computeAlerts(property).length;
    const tabsHtml = tabs.map(t => {
      const badge = (t === 'schedule' && alertCount > 0) ? `<span class="tab-badge">${alertCount}</span>` : '';
      return `<button class="tab-btn ${t===state.activeTab?'active':''}" data-action="set-tab" data-tab="${t}">${tabLabels[t]}${badge}</button>`;
    }).join('');

    const statusStamp = `<span class="stamp status-${property.status}">${STATUS_LABELS[property.status]}</span>`;

    el.innerHTML = `
      <div class="prop-header">
        <div>
          <h2>${esc(property.name)}</h2>
          <div class="addr">${esc(property.address)}, ${esc(property.city)} ${esc(property.postalCode||'')} · ${property.areaM2||'—'} m² · ${property.rentalMode==='by_room' ? 'wynajem na pokoje' : 'wynajem całości'}</div>
        </div>
        <div class="prop-actions">
          ${statusStamp}
          <button class="btn-icon" data-action="edit-property" data-id="${property.id}" title="Edytuj">✎</button>
          <button class="btn-icon" data-action="delete-property" data-id="${property.id}" title="Usuń">🗑</button>
        </div>
      </div>
      <div class="tabs">${tabsHtml}</div>
      <div id="tabContent" class="fade-in"></div>
    `;
    renderTabContent(property);
  }

  function renderTabContent(property){
    const c = document.getElementById('tabContent');
    if(state.activeTab === 'overview') c.innerHTML = overviewHtml(property);
    else if(state.activeTab === 'rooms') c.innerHTML = roomsHtml(property);
    else if(state.activeTab === 'leases') c.innerHTML = leasesHtml(property);
    else if(state.activeTab === 'finance') c.innerHTML = financeHtml(property);
    else if(state.activeTab === 'taxes') c.innerHTML = taxesHtml();
    else if(state.activeTab === 'meters') c.innerHTML = metersHtml(property);
    else if(state.activeTab === 'schedule') c.innerHTML = scheduleHtml(property);
    else if(state.activeTab === 'notes') c.innerHTML = notesHtml(property);
  }

  /* ======================================================================
     OVERVIEW TAB
     ====================================================================== */
  function infoPanelHtml(property){
    const items = [
      ['Adres', esc(property.address) + ', ' + esc(property.city) + ' ' + esc(property.postalCode||'')],
      ['Metraż', property.areaM2 ? property.areaM2 + ' m²' : '—'],
      ['Piętro', (property.floor!==null && property.floor!==undefined && property.floor!=='') ? property.floor : '—'],
      ['Rok budowy', property.yearBuilt || '—'],
      ['Cena zakupu', property.purchasePrice ? money(property.purchasePrice) : '—'],
      ['Aktualna wartość', property.currentValue ? money(property.currentValue) : '—'],
      ['Numer Księgi Wieczystej', esc(property.kwNumber) || '—'],
      ['Świadectwo charakterystyki energ. (ŚChE)', property.energyCertificate ? ENERGY_CERT_LABELS[property.energyCertificate] : '— nie wskazano —'],
      ['Ubezpieczenie ważne do', property.insuranceExpiryDate ? fmtDate(property.insuranceExpiryDate) : '— nie wskazano —']
    ];
    return `
      <div class="panel">
        <h3>Informacje o nieruchomości</h3>
        <div class="info-grid">
          ${items.map(([label,value]) => `<div class="info-item"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('')}
        </div>
      </div>`;
  }

  function overviewHtml(property){
    const t = propertyTotals(property);
    const occ = occupancy(property);
    const outstanding = outstandingAmount(property);
    const taxDue = combinedTaxDue();
    const months = monthlyTotals(property, 6);
    const maxVal = Math.max(1, ...months.map(m => Math.max(m.income, m.expense)));
    const barW = 64, gap = 18, chartW = months.length * (barW + gap), baseY = 150;

    const bars = months.map((m, i) => {
      const x = i * (barW + gap) + gap/2;
      const incH = (m.income / maxVal) * 120;
      const expH = (m.expense / maxVal) * 120;
      return `
        <g>
          <rect x="${x}" y="${baseY - incH}" width="22" height="${incH}" rx="3" fill="var(--income)"></rect>
          <rect x="${x+26}" y="${baseY - expH}" width="22" height="${expH}" rx="3" fill="var(--expense)"></rect>
          <text x="${x+24}" y="${baseY+20}" text-anchor="middle" font-size="11" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">${m.label}</text>
        </g>`;
    }).join('');

    const allEntries = allEffectiveEntries(property);
    const recent = allEntries.slice().sort((a,b)=> b.entryDate.localeCompare(a.entryDate)).slice(0,5);
    const recentHtml = recent.length ? recent.map(e => ledgerRow(property, e)).join('') :
      `<div class="empty-state" style="padding:24px;"><p>Brak wpisów finansowych jeszcze.</p></div>`;

    let modeCard;
    if(occ !== null){
      modeCard = `<div class="stat-card"><div class="label">Obłożenie pokoi</div><div class="value">${occ}%</div><div class="sub">${property.rooms.filter(r=>!!activeLeaseFor(property,r.id)).length} / ${property.rooms.length} wynajęte</div></div>`;
    } else {
      const lease = activeLeaseFor(property, null);
      modeCard = lease
        ? `<div class="stat-card"><div class="label">Aktualny najemca</div><div class="value" style="font-size:18px;">${esc(lease.tenantName)}</div><div class="sub">do ${lease.endDate?fmtDate(lease.endDate):'czasu nieokreślonego'}</div></div>`
        : `<div class="stat-card"><div class="label">Status najmu</div><div class="value" style="font-size:18px;">Wolne</div><div class="sub">Docelowy czynsz: ${money(property.targetMonthlyRent)}</div></div>`;
    }

    return `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Przychód łącznie</div><div class="value pos">${money(t.income)}</div></div>
        <div class="stat-card"><div class="label">Koszty łącznie</div><div class="value neg">${money(t.expense)}</div></div>
        <div class="stat-card"><div class="label">Zysk netto</div><div class="value ${t.net>=0?'pos':'neg'}">${money(t.net)}</div></div>
        ${modeCard}
        <div class="stat-card"><div class="label">Zaległości czynszowe</div><div class="value ${outstanding>0?'neg':''}">${money(outstanding)}</div></div>
        ${taxDue!==null ? `<div class="stat-card"><div class="label">Podatek do zapłaty (portfel)</div><div class="value ${taxDue>0?'neg':''}">${money(taxDue)}</div></div>` : ''}
      </div>

      ${infoPanelHtml(property)}

      <div class="panel">
        <h3>Przychody i koszty — ostatnie 6 miesięcy</h3>
        <div class="chart-legend"><span><i class="leg-income"></i>Przychód</span><span><i class="leg-expense"></i>Koszt</span></div>
        <svg viewBox="0 0 ${chartW} 180" style="width:100%; height:180px; overflow:visible;">${bars}</svg>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Ostatnie wpisy</h3><button class="btn btn-line btn-sm" data-action="set-tab" data-tab="finance">Zobacz wszystkie →</button></div>
        ${recentHtml}
      </div>
    `;
  }

  /* ======================================================================
     ROOMS TAB

    const termLabel = `${fmtDate(lease.startDate)} → ${lease.endDate ? fmtDate(lease.endDate) : 'czas nieokreślony'}`;
    const intervalM = PAYMENT_FREQUENCY_MONTHS[lease.paymentFrequency] || 1;

    const docsHtml = lease.documents.length
      ? lease.documents.map(d => `
          <div class="doc-chip">
            <span class="doc-name">📄 ${esc(d.name)}</span>

          </div>
          <span class="stamp ${statusMeta[0]}">${statusMeta[1]}</span>
        </div>
        <div class="room-line"><span>Okres umowy</span><span class="mono">${termLabel}</span></div>
        <div class="room-line"><span>Kwota raty${intervalM>1 ? ' ('+PAYMENT_FREQUENCY_LABELS[lease.paymentFrequency]+')' : ' / mies.'}</span><span class="mono room-rent">${money(rateAmount)}</span></div>
        ${intervalM>1 ? `<div class="room-line"><span>Czynsz bazowy / mies.</span><span class="mono">${money(lease.monthlyRent)}</span></div>` : ''}
        <div class="room-line"><span>Data pierwszej płatności</span><span class="mono">${fmtDate(lease.firstPaymentDate)}</span></div>
        <div class="room-line"><span>Kolejne płatności</span><span class="mono">${PAYMENT_FREQUENCY_LABELS[lease.paymentFrequency]||'Miesięcznie'} · do ${lease.rentDueDay||10}. dnia</span></div>
        <div class="room-line">
          <span>Kaucja</span>
          <span class="mono">${lease.depositAmount ? money(lease.depositAmount) : '—'}${lease.depositAmount ? `<span class="deposit-badge ${lease.depositPaid?'paid':'unpaid'}">${lease.depositPaid?'✓ Wpłacona':'Niewpłacona'}</span>` : ''}</span>
        </div>
        ${lease.notes ? `<div class="room-tenant">${esc(lease.notes)}</div>` : ''}
        <div class="doc-section">
          <div class="doc-list">${docsHtml}</div>
          <label class="btn btn-line btn-sm btn-block doc-upload-btn">
            + Dodaj dokument (umowa, protokół...)
            <input type="file" multiple data-action="upload-document" data-prop="${property.id}" data-lease="${lease.id}">
          </label>
        </div>
        <div class="room-actions">
          <button class="btn-icon" data-action="edit-lease" data-prop="${property.id}" data-id="${lease.id}">✎ Edytuj</button>
          <button class="btn-icon" data-action="delete-lease" data-prop="${property.id}" data-id="${lease.id}">🗑</button>
        </div>
      </div>`;
  }

  function leasesHtml(property){
    if(property.rentalMode === 'by_room' && !property.rooms.length){
      return `
        <div class="empty-state">
          <h3>Najpierw dodaj pokój</h3>

      `<div class="empty-state"><h3>Brak umów najmu</h3><p>Dodaj pierwszą umowę — na jej podstawie będziemy automatycznie liczyć przychód aż do dnia jej wygaśnięcia.</p></div>`;

      <div class="panel-head">
        <h3 style="margin:0;">Umowy najmu (${leases.length})</h3>

      </div>
      <div class="room-grid">${cards}</div>

  }

  function openLeaseForm(propId, editId){

  function submitLeaseForm(){
    const form = document.getElementById('leaseForm');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const card = document.getElementById('modalCard');
    const property = getProperty(card.dataset.propId);
    const editId = card.dataset.editId;
    const roomId = fd.get('roomId') || null;
    if(property.rentalMode === 'by_room' && !roomId){
      alert('Wybierz pokój, do którego przypisana jest umowa.');
      return;
    }
    const data = {
      roomId, tenantName: fd.get('tenantName').trim(), tenantContact: fd.get('tenantContact').trim(),
      startDate: fd.get('startDate'), endDate: fd.get('endDate') || null,
      monthlyRent: parseFloat(fd.get('monthlyRent')) || 0,
      firstPaymentDate: fd.get('firstPaymentDate'), paymentFrequency: fd.get('paymentFrequency'),
      rentDueDay: parseInt(fd.get('rentDueDay')) || 10,
      depositAmount: parseFloat(fd.get('depositAmount')) || 0,
      depositPaid: fd.get('depositPaid') === 'on', isOccasional: fd.get('isOccasional') === 'on',
      notes: fd.get('notes').trim()
    };

      Object.assign(property.leases.find(x => x.id === editId), data);
      toast('Zapisano zmiany w umowie.');
    } else {
      property.leases.push(Object.assign({ id: uid('lease'), documents:[], payments:{} }, data));
      toast('Dodano umowę najmu.');
    }

    render();

  function deleteLease(propId, id){
    if(!confirm('Usunąć tę umowę najmu? Powiązane dokumenty również zostaną usunięte.')) return;
    const property = getProperty(propId);
    const lease = property.leases.find(l => l.id === id);
    if(lease) lease.documents.forEach(d => { try{ URL.revokeObjectURL(d.url); }catch(e){} });
    property.leases = property.leases.filter(l => l.id !== id);
    toast('Umowa najmu usunięta.');
    render();
  }
  function uploadDocument(propId, leaseId, fileList){
    const property = getProperty(propId);
    const lease = property.leases.find(l => l.id === leaseId);
    Array.from(fileList).forEach(file => {
      lease.documents.push({
        id: uid('doc'), name:file.name, sizeLabel:formatSize(file.size),
        fileType:file.type, url:URL.createObjectURL(file), uploadedAt: TODAY_STR
      });
    });
    toast(fileList.length > 1 ? 'Dodano dokumenty.' : 'Dodano dokument.');
    render();
  }
  function deleteDocument(propId, leaseId, docId){
    const property = getProperty(propId);
    const lease = property.leases.find(l => l.id === leaseId);
    const idx = lease.documents.findIndex(d => d.id === docId);
    if(idx > -1){ try{ URL.revokeObjectURL(lease.documents[idx].url); }catch(e){} lease.documents.splice(idx,1); }
    toast('Dokument usunięty.');
    render();
  }

  /* ======================================================================
     FINANCE TAB
     ====================================================================== */
  function ledgerRow(property, e, showPropertyTag){
    const room = e.roomId ? property.rooms.find(r => r.id === e.roomId) : null;
    let dateMeta;
    if(e.isVirtual && e.periodStart && e.periodEnd){
      dateMeta = `<span class="meta mono">okres: ${fmtDate(e.periodStart)} – ${fmtDate(e.periodEnd)} · termin: ${fmtDate(e.dueDate)}</span>`;
    } else if(e.isVirtual && e.dueDate){
      dateMeta = `<span class="meta mono">okres: ${monthLabel(monthKey(e.entryDate))} · termin: ${fmtDate(e.dueDate)}</span>`;
    } else {
      dateMeta = `<span class="meta mono">${fmtDate(e.entryDate)}</span>`;
    }
    let actions;
    if(e.isVirtual && e.category === 'rent_income'){
      const lease = property.leases.find(l => l.id === e.leaseId);
      const mKey = monthKey(e.entryDate);
      const status = lease ? paymentStatusFor(lease, mKey) : 'unpaid';
      actions = `
        <select class="pay-status pay-${status}" data-action="set-payment-status" data-prop="${property.id}" data-lease="${e.leaseId}" data-month="${mKey}">
          <option value="unpaid" ${status==='unpaid'?'selected':''}>${PAY_STATUS_LABELS.unpaid}</option>
          <option value="paid" ${status==='paid'?'selected':''}>${PAY_STATUS_LABELS.paid}</option>
          <option value="late" ${status==='late'?'selected':''}>${PAY_STATUS_LABELS.late}</option>
        </select>`;
    } else if(e.isVirtual){
      actions = `<span class="ledger-auto-tag">auto · cykliczny</span>`;
    } else {
      actions = `<div class="row-actions">
          <button class="btn-icon" data-action="edit-entry" data-prop="${property.id}" data-id="${e.id}">✎</button>
          <button class="btn-icon" data-action="delete-entry" data-prop="${property.id}" data-id="${e.id}">🗑</button>
        </div>`;
    }
    return `
      <div class="ledger-row">
        <div class="desc-block">
          <span class="desc-text">${esc(e.description) || categoryLabelFor(e)}</span>
          <span class="tag">${categoryLabelFor(e)}</span>
          ${showPropertyTag ? `<span class="tag">${esc(property.name)}</span>` : ''}
          ${room ? `<span class="tag">${esc(room.name)}</span>` : ''}
        </div>
        <span class="leader"></span>
        ${dateMeta}
        <span class="amount ${e.entryType} mono">${e.entryType==='income' ? '+' : '−'} ${money(e.amount)}</span>
        ${actions}
      </div>`;
  }

  function categoryOptions(type, selected){
    const cats = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
    return cats.map(c => `<option value="${c}" ${c===selected?'selected':''}>${CATEGORY_LABELS[c]}</option>`).join('');
  }

  /* --- combined finance filter (wiele nieruchomości / wiele pokoi) --- */
  function buildFinanceLocations(includedProps){
    const multi = includedProps.length > 1;
    const locations = [];
    includedProps.forEach(p => {
      locations.push({ key: p.id+'|none', propId:p.id, label: (multi? esc(p.name)+' — ':'')+'Cała nieruchomość (bez pokoju)' });
      p.rooms.forEach(r => locations.push({ key: p.id+'|'+r.id, propId:p.id, label: (multi? esc(p.name)+' — ':'')+esc(r.name) }));
    });
    return locations;
  }

  function financeHtml(property){
    const f = state.financeFilter;
    if(!f.propertyIds) f.propertyIds = [property.id];
    if(!f.propertyIds.includes(property.id)) f.propertyIds = [property.id].concat(f.propertyIds);

    const includedProps = state.properties.filter(p => f.propertyIds.includes(p.id));
    const multiProp = includedProps.length > 1;
    const locations = buildFinanceLocations(includedProps);

    if(!f.locationKeys) f.locationKeys = locations.map(l => l.key);
    f.locationKeys = f.locationKeys.filter(k => locations.some(l => l.key === k));
    if(!f.locationKeys.length) f.locationKeys = locations.map(l => l.key);

    let rowsData = [];
    includedProps.forEach(p => {
      allEffectiveEntries(p).forEach(e => {
        const locKey = p.id + '|' + (e.roomId || 'none');
        if(f.locationKeys.includes(locKey)) rowsData.push({ entry:e, property:p });
      });
    });
    if(f.type !== 'all') rowsData = rowsData.filter(x => x.entry.entryType === f.type);
    rowsData.sort((a,b) => b.entry.entryDate.localeCompare(a.entry.entryDate));

    const rows = rowsData.length ? rowsData.map(x => ledgerRow(x.property, x.entry, multiProp)).join('') :
      `<div class="empty-state" style="padding:30px;"><p>Brak wpisów dla wybranych filtrów.</p></div>`;

    const propChecklist = state.properties.map(p => `
      <label><input type="checkbox" ${f.propertyIds.includes(p.id)?'checked':''} ${p.id===property.id?'disabled':''} data-action="filter-toggle-property" data-id="${p.id}"> ${esc(p.name)}${p.id===property.id?' (aktualna)':''}</label>
    `).join('');

    const locChecklist = locations.map(l => `
      <label><input type="checkbox" ${f.locationKeys.includes(l.key)?'checked':''} data-action="filter-toggle-location" data-key="${l.key}"> ${l.label}</label>
    `).join('');

    return `
      ${recurringCostsPanelHtml(property)}
      <div class="panel-head">
        <h3 style="margin:0;">Wpisy finansowe</h3>
        <button class="btn btn-brass btn-sm" data-action="add-entry" data-prop="${property.id}">+ Dodaj wpis</button>
      </div>
      <div class="hint" style="margin-bottom:10px;">Czynsz od najemcy i skonfigurowane koszty cykliczne generują się automatycznie. Nowy ręczny wpis zawsze dotyczy aktualnie otwartej nieruchomości („${esc(property.name)}”).</div>

      <div class="filter-group">
        <div class="filter-group-head"><span>Typ wpisu</span></div>
        <select data-action="filter-type">
          <option value="all" ${f.type==='all'?'selected':''}>Wszystkie typy</option>
          <option value="income" ${f.type==='income'?'selected':''}>Tylko przychody</option>
          <option value="expense" ${f.type==='expense'?'selected':''}>Tylko koszty</option>
        </select>
      </div>

      ${state.properties.length > 1 ? `
      <div class="filter-group">
        <div class="filter-group-head">
          <span>Nieruchomości w widoku</span>
          <span><button class="filter-mini-btn" type="button" data-action="filter-all-properties">Zaznacz wszystkie</button> · <button class="filter-mini-btn" type="button" data-action="filter-none-properties">Tylko aktualna</button></span>
        </div>
        <div class="checklist">${propChecklist}</div>
      </div>` : ''}

      ${locations.length ? `
      <div class="filter-group">
        <div class="filter-group-head">
          <span>Pokoje / lokalizacje</span>
          <span><button class="filter-mini-btn" type="button" data-action="filter-all-locations">Zaznacz wszystkie</button> · <button class="filter-mini-btn" type="button" data-action="filter-none-locations">Odznacz wszystkie</button></span>

  /* ======================================================================

     ====================================================================== */
  function inspectionCardHtml(property, insp){
    const next = nextInspectionDate(insp);
    const overdue = next && next < TODAY;
    const soon = next && !overdue && daysBetween(TODAY, next) <= ALERT_WINDOW_DAYS;
    const stampClass = overdue ? 'vacant' : (soon ? 'status-active' : 'occupied');
    const stampLabel = overdue ? 'Po terminie' : (soon ? 'Nadchodzi' : 'Aktualny');
    return `
      <div class="room-card">
        <div class="room-top">
          <div class="room-name">${esc(inspectionLabel(insp))}</div>
          <span class="stamp ${stampClass}">${stampLabel}</span>
        </div>
        <div class="room-line"><span>Ostatni przegląd</span><span class="mono">${fmtDate(insp.lastDate)}</span></div>
        <div class="room-line"><span>Następny termin</span><span class="mono">${next ? fmtDate(next.toISOString().slice(0,10)) : '—'}</span></div>
        <div class="room-line"><span>Częstotliwość</span><span class="mono">${insp.frequencyMonths} mc.</span></div>
        <div class="room-actions">
          <button class="btn btn-line btn-sm" data-action="mark-inspection-done" data-prop="${property.id}" data-id="${insp.id}">Wykonano dziś</button>
          <button class="btn-icon" data-action="edit-inspection" data-prop="${property.id}" data-id="${insp.id}">✎</button>
          <button class="btn-icon" data-action="delete-inspection" data-prop="${property.id}" data-id="${insp.id}">🗑</button>
        </div>
      </div>`;
  }

        <div class="desc-block"><span class="desc-text" style="max-width:100%; white-space:normal;">${esc(a.text)}</span></div>
        <span class="stamp ${a.severity==='overdue'?'vacant':'status-active'}">${a.severity==='overdue'?'Po terminie':'Nadchodzi'}</span>
      </div>`).join('') : `<div class="meta" style="padding:10px 0;">Brak nadchodzących terminów w najbliższych ${ALERT_WINDOW_DAYS} dniach.</div>`;

    return `

          document.getElementById('targetRentField').style.display = e.target.value === 'by_room' ? 'none' : '';
        });

    document.getElementById('modalCard').dataset.editId = editId || '';

  function submitPropertyForm(){
    const form = document.getElementById('propertyForm');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const editId = document.getElementById('modalCard').dataset.editId;
    const data = {
      name: fd.get('name').trim(), address: fd.get('address').trim(), city: fd.get('city').trim(),
      postalCode: fd.get('postalCode').trim(), areaM2: parseFloat(fd.get('areaM2')) || null,
      roomsCount: parseInt(fd.get('roomsCount')) || null, floor: parseInt(fd.get('floor')) || null,
      yearBuilt: parseInt(fd.get('yearBuilt')) || null, purchasePrice: parseFloat(fd.get('purchasePrice')) || null,
      currentValue: parseFloat(fd.get('currentValue')) || null, rentalMode: fd.get('rentalMode'),
      targetMonthlyRent: parseFloat(fd.get('targetMonthlyRent')) || null, status: fd.get('status'),
      kwNumber: fd.get('kwNumber').trim(), energyCertificate: fd.get('energyCertificate'),
      insuranceExpiryDate: fd.get('insuranceExpiryDate') || null,
      photoUrl: fd.get('photoUrl').trim(), notes: fd.get('notes').trim()
    };

        id: uid('prop'), rooms:[], financeEntries:[], leases:[], inspections:[], meters:[], recurringCosts:[]
      }, data);
      state.properties.push(p);
      state.activePropertyId = p.id;
      state.activeTab = 'overview';
      state.financeFilter = freshFinanceFilter(p.id);
      if(!state.taxSettings.includedIds.includes(p.id)) state.taxSettings.includedIds.push(p.id);
      toast('Dodano nową nieruchomość.');
    }
    closeModal();
    render();

  function deleteProperty(id){
    const p = getProperty(id);
    if(!confirm(`Usunąć nieruchomość „${p.name}” wraz z pokojami, umowami najmu i wpisami finansowymi?`)) return;
    p.leases.forEach(l => l.documents.forEach(d => { try{ URL.revokeObjectURL(d.url); }catch(e){} }));
    state.properties = state.properties.filter(x => x.id !== id);
    state.taxSettings.includedIds = state.taxSettings.includedIds.filter(x => x !== id);
    if(state.activePropertyId === id){
      state.activePropertyId = state.properties[0] ? state.properties[0].id : null;
      state.activeTab = 'overview';
      state.financeFilter = freshFinanceFilter(state.activePropertyId);
    }
    toast('Nieruchomość usunięta.');
    render();
  }

  /* ======================================================================
     EVENT DELEGATION
     ====================================================================== */
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;

    if(action === 'select-property'){
      state.activePropertyId = t.dataset.id;
      state.activeTab = 'overview';
      state.financeFilter = freshFinanceFilter(t.dataset.id);
      render();
    }
    else if(action === 'set-tab'){ state.activeTab = t.dataset.tab; renderMain(); }
    else if(action === 'add-property'){ openPropertyForm(null); }
    else if(action === 'edit-property'){ openPropertyForm(t.dataset.id); }
    else if(action === 'delete-property'){ deleteProperty(t.dataset.id); }
    else if(action === 'submit-property'){ submitPropertyForm(); }

    else if(action === 'add-room'){ openRoomForm(t.dataset.prop, null); }
    else if(action === 'edit-room'){ openRoomForm(t.dataset.prop, t.dataset.id); }
    else if(action === 'delete-room'){ deleteRoom(t.dataset.prop, t.dataset.id); }
    else if(action === 'submit-room'){ submitRoomForm(); }

    else if(action === 'add-lease'){ openLeaseForm(t.dataset.prop, null); }
    else if(action === 'edit-lease'){ openLeaseForm(t.dataset.prop, t.dataset.id); }
    else if(action === 'delete-lease'){ deleteLease(t.dataset.prop, t.dataset.id); }
    else if(action === 'submit-lease'){ submitLeaseForm(); }
    else if(action === 'delete-document'){ deleteDocument(t.dataset.prop, t.dataset.lease, t.dataset.doc); }

    else if(action === 'add-entry'){ openEntryForm(t.dataset.prop, null); }
    else if(action === 'edit-entry'){ openEntryForm(t.dataset.prop, t.dataset.id); }
    else if(action === 'delete-entry'){ deleteEntry(t.dataset.prop, t.dataset.id); }
    else if(action === 'submit-entry'){ submitEntryForm(); }

    else if(action === 'add-recurring-cost'){ openRecurringCostForm(t.dataset.prop); }
    else if(action === 'submit-recurring-cost'){ submitRecurringCostForm(); }
    else if(action === 'delete-recurring-cost'){ deleteRecurringCost(t.dataset.prop, t.dataset.id); }
    else if(action === 'add-rate-tranche'){ openRateTrancheForm(t.dataset.prop, t.dataset.cost); }
    else if(action === 'submit-rate-tranche'){ submitRateTrancheForm(); }
    else if(action === 'delete-rate-tranche'){ deleteRateTranche(t.dataset.prop, t.dataset.cost, t.dataset.tranche); }

    else if(action === 'filter-all-properties'){
      state.financeFilter.propertyIds = state.properties.map(p => p.id);
      state.financeFilter.locationKeys = null;
      renderMain();
    }
    else if(action === 'filter-none-properties'){
      state.financeFilter.propertyIds = [state.activePropertyId];
      state.financeFilter.locationKeys = null;
      renderMain();
    }
    else if(action === 'filter-all-locations'){
      const includedProps = state.properties.filter(p => state.financeFilter.propertyIds.includes(p.id));
      state.financeFilter.locationKeys = buildFinanceLocations(includedProps).map(l => l.key);
      renderMain();
    }
    else if(action === 'filter-none-locations'){
      state.financeFilter.locationKeys = [];
      renderMain();
    }

    else if(action === 'add-meter'){ openMeterForm(t.dataset.prop, null); }
    else if(action === 'edit-meter'){ openMeterForm(t.dataset.prop, t.dataset.id); }
    else if(action === 'delete-meter'){ deleteMeter(t.dataset.prop, t.dataset.id); }
    else if(action === 'submit-meter'){ submitMeterForm(); }
    else if(action === 'add-reading'){ openReadingForm(t.dataset.prop, t.dataset.meter); }
    else if(action === 'submit-reading'){ submitReadingForm(); }
    else if(action === 'delete-reading'){ deleteReading(t.dataset.prop, t.dataset.meter, t.dataset.id); }

    else if(action === 'add-inspection'){ openInspectionForm(t.dataset.prop, null); }
    else if(action === 'edit-inspection'){ openInspectionForm(t.dataset.prop, t.dataset.id); }
    else if(action === 'delete-inspection'){ deleteInspection(t.dataset.prop, t.dataset.id); }
    else if(action === 'submit-inspection'){ submitInspectionForm(); }
    else if(action === 'mark-inspection-done'){ markInspectionDone(t.dataset.prop, t.dataset.id); }

    else if(action === 'close-modal'){ closeModal(); }
    else if(action === 'save-notes'){
      const property = getProperty(t.dataset.prop);
      property.notes = document.getElementById('notesArea').value;
      toast('Notatka zapisana.');
    }
  });

  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if(t.dataset.action === 'filter-type'){ state.financeFilter.type = t.value; renderMain(); }
    else if(t.dataset.action === 'filter-toggle-property'){
      const id = t.dataset.id;
      if(t.checked){ if(!state.financeFilter.propertyIds.includes(id)) state.financeFilter.propertyIds.push(id); }
      else { state.financeFilter.propertyIds = state.financeFilter.propertyIds.filter(x => x !== id); }
      state.financeFilter.locationKeys = null;
      renderMain();
    }
    else if(t.dataset.action === 'filter-toggle-location'){
      const key = t.dataset.key;
      if(t.checked){ if(!state.financeFilter.locationKeys.includes(key)) state.financeFilter.locationKeys.push(key); }
      else { state.financeFilter.locationKeys = state.financeFilter.locationKeys.filter(x => x !== key); }
      renderMain();
    }
    else if(t.dataset.action === 'upload-document'){ uploadDocument(t.dataset.prop, t.dataset.lease, t.files); }
    else if(t.dataset.action === 'set-payment-status'){
      const property = getProperty(t.dataset.prop);
      const lease = property.leases.find(l => l.id === t.dataset.lease);
      if(lease){ if(!lease.payments) lease.payments = {}; lease.payments[t.dataset.month] = t.value; toast('Zapisano status płatności.'); renderMain(); }
    }
    else if(t.dataset.action === 'set-tax-rate'){ state.taxSettings.rate = t.value; renderMain(); }
    else if(t.dataset.action === 'set-tax-frequency'){ state.taxSettings.frequency = t.value; renderMain(); }
    else if(t.dataset.action === 'toggle-tax-paid'){ state.taxSettings.payments[t.dataset.period] = t.checked; renderMain(); }
    else if(t.dataset.action === 'toggle-tax-property'){
      const id = t.dataset.id;
      if(t.checked){ if(!state.taxSettings.includedIds.includes(id)) state.taxSettings.includedIds.push(id); }
      else { state.taxSettings.includedIds = state.taxSettings.includedIds.filter(x => x !== id); }
      renderMain();
    }
  });

  document.getElementById('modalOverlay').addEventListener('click', (ev) => {
    if(ev.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (ev) => {
    if(ev.key === 'Escape') closeModal();
  });

  /* ======================================================================
     PERSISTENCE BRIDGE — parent (React route) <-> iframe
     ====================================================================== */
  let __hydrating = true;
  const __origRender = render;
  let __saveTimer = null;
  render = function(){
    __origRender();
    if(__hydrating) return;
    clearTimeout(__saveTimer);
    __saveTimer = setTimeout(() => {
      try {
        const snapshot = JSON.parse(JSON.stringify(state));
        window.parent.postMessage({ type:'portfel:save', state: snapshot }, '*');
      } catch(e){ /* noop */ }
    }, 500);
  };
  window.addEventListener('message', (ev) => {
    const d = ev.data;
    if(!d || typeof d !== 'object') return;
    if(d.type === 'portfel:load'){
      if(d.state && typeof d.state === 'object'){
        state.properties = Array.isArray(d.state.properties) ? d.state.properties : [];
        state.activePropertyId = d.state.activePropertyId || (state.properties[0]?.id ?? null);
        state.activeTab = d.state.activeTab || 'overview';
        state.financeFilter = d.state.financeFilter || freshFinanceFilter(state.activePropertyId);
        state.taxSettings = d.state.taxSettings || { rate:'', frequency:'monthly', includedIds:[], payments:{} };
      }
      __hydrating = false;
      render();
    }
  });
  try { window.parent.postMessage({ type:'portfel:ready' }, '*'); } catch(e){}
  setTimeout(() => { if(__hydrating){ __hydrating = false; render(); } }, 2000);
})();
</script>
</body>
</html>
